name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_MANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          "$SDK_MANAGER" --version
          "$SDK_MANAGER" "platforms;android-33" "build-tools;33.0.2"
        
      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew :FarsiFlixModularProvider:make makePluginsJson
          cp FarsiFlixModularProvider/build/*.cs3 "$GITHUB_WORKSPACE/builds/"
          python3 - <<'PY'
          import json
          from pathlib import Path
          plugins = json.loads(Path("build/plugins.json").read_text())
          chosen = [p for p in plugins if p.get("internalName") == "FarsiFlixModularProvider"]
          if len(chosen) != 1:
              raise RuntimeError(f"Expected one modular plugin, got {len(chosen)}")
          chosen[0]["repositoryUrl"] = "https://github.com/It5Daniel/per3"
          chosen[0]["url"] = "https://raw.githubusercontent.com/It5Daniel/per3/builds/FarsiFlixModularProvider.cs3"
          Path("../builds/plugins.json").write_text(json.dumps(chosen, indent=2))
          PY

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push
